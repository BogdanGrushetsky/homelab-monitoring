[global]
# Refresh interval in seconds
refresh=3
check_update=false

# ──────────────────────────────────────────
# CPU
# ──────────────────────────────────────────
[cpu]
# careful / warning / critical in percent
careful=60
warning=80
critical=95

[percpu]
careful=60
warning=80
critical=95

# ──────────────────────────────────────────
# Memory
# ──────────────────────────────────────────
[mem]
careful=60
warning=80
critical=95

[memswap]
careful=50
warning=70
critical=90

# ──────────────────────────────────────────
# Temperature (lm-sensors / hwmon)
# ──────────────────────────────────────────
[sensors]
temperature_unit=C
careful=60
warning=75
critical=90

# ──────────────────────────────────────────
# Load average
# ──────────────────────────────────────────
[load]
careful=0.7
warning=1.0
critical=5.0

# ──────────────────────────────────────────
# Disk — space usage
# ──────────────────────────────────────────
[fs]
careful=50
warning=70
critical=90

# ──────────────────────────────────────────
# Disk — I/O read/write speed
# ──────────────────────────────────────────
[diskio]
hide=loop.*,ram.*,zram.*

# ──────────────────────────────────────────
# Network
# ──────────────────────────────────────────
[network]
hide=lo
rx_careful=70
rx_warning=80
rx_critical=90
tx_careful=70
tx_warning=80
tx_critical=90

# ──────────────────────────────────────────
# Battery
# ──────────────────────────────────────────
[batpercent]
careful=20
warning=10
critical=5

# ──────────────────────────────────────────
# Docker containers
# ──────────────────────────────────────────
[docker]
# Show only running containers
all=false

# ──────────────────────────────────────────
# Processes — top consumers
# ──────────────────────────────────────────
[processlist]
cpu_careful=50
cpu_warning=70
cpu_critical=90
mem_careful=20
mem_warning=50
mem_critical=70

# ──────────────────────────────────────────
# Web server output
# ──────────────────────────────────────────
[outputs]
max_processes_displayed=35
